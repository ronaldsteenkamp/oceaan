# Runs on every push: builds the ocean from src/, runs the self-test in headless Chrome, and on main puts dist/ on gh-pages.
# Builds the ocean from src/, runs the self-test in headless Chrome, and on main puts dist/ on the branch gh-pages,
# exactly like publish.py does. GitHub Pages keeps showing that branch, so the script and the Action never get in each other's way.
# On a pull request (or a push to another branch) it only builds and tests.
name: Bouwen, testen en publiceren

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.2.1
      - name: Bouwen en zelftest
        run: python build.py
      - name: Schermafbeeldingen bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: checks/*.png
          if-no-files-found: ignore
      - name: Op gh-pages zetten
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Oceaan gebouwd uit ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
